<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>

    // 「ポケモンを探す」後の画面表示
    let encountHtml =
      `
      <p class="name"></p>
      <div>
        <img class="img" src="" alt="ポケモンの画像">
      </div>
      <div>
        <button class="btn" id="catch">捕まえる</button>
        <button class="btn" data-js="reset">逃げる</button>
      </div>
      `

    // 「捕まえる」成功時の画面表示
    let doneHtml =
      `
      <p class="name">ゲットしました</p>
      <div>
        <img class="img" src="" alt="モンスターボールの画像">
      </div>
      <button class="btn" data-js="reset">戻る</button>
       `

    let failHtml =
      `
      <p class="text">逃げられてしまった...</p>
      <button class="btn mt" data-js="reset">戻る</button>
      `

    //探す→捕まえる・逃げる
    $('#pokemon_search').click(function () {
      let kantoPokeId = Math.floor(Math.random() * 151) + 1;
      $.ajax({
        url: `https://pokeapi.co/api/v2/pokemon/${kantoPokeId}`,
        method: 'GET',
        dataType: 'json'
      })
        .done(function (res) {
          const imageUrl = res.sprites.front_default;

          $.ajax({
            url: res.species.url,
            method: 'GET',
            dataType: 'json'
          })
            .done(function (species) {
              const jaName = species.names.find(n => n.language.name === 'ja')?.name;

              $('#wrapper').html(encountHtml);
              $('.name').text(jaName);
              $('.img').attr('src', imageUrl);
            })
            .fail(function (err) {
              console.error('日本語名の取得に失敗', err);
              alert("日本語名の取得に失敗");
            });
        })
        .fail(function (err) {
          console.error('接続エラーが発生しました', err);
          alert("接続エラーが発生しました");
        });
    });

    // 捕まえたかどうか・モンスターボールAPI取得
    $(document).on('click', '#catch', function () {
      $.ajax({
        url: 'https://pokeapi.co/api/v2/item/4',
        method: 'GET',
        dataType: 'json'
      })
        .done(function (res) {
          // 捕まえる成功判定
          let throwBall = (Math.floor(10 * Math.random()) > 4);
          if (throwBall) {
            console.log('モンスターボール取得成功！', res);
            const ballUrl = res.sprites.default;
            $('#wrapper').html(doneHtml);
            $('.img').attr('src', ballUrl);
          } else {
            $('#wrapper').html(failHtml);
          }
        })
        .fail(function (err) {
          console.error('モンスターボールの取得に失敗しました', err);
          alert("モンスターボールの取得に失敗しました");
        });
    });

    //リセット
    $(document).on('click', '[data-js="reset"]', function () {
      location.reload();
    })

  </script>
</body>

</html>
